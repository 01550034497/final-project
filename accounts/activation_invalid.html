{% extends 'base.html' %}

{% block title %}رابط غير صالح{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg text-center border-danger">
                <div class="card-body p-5">
                    <i class="fas fa-times-circle fa-5x text-danger mb-4"></i>
                    <h3 class="mb-3">رابط التفعيل غير صالح</h3>
                    <p class="text-muted">{{ reason }}</p>
                    <a href="{% url 'accounts:register' %}" class="btn btn-primary mt-3">
                        <i class="fas fa-user-plus"></i> إعادة التسجيل
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
