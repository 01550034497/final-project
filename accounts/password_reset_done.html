{% extends 'base.html' %}

{% block title %}تم إرسال الرابط{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg text-center">
                <div class="card-body p-5">
                    <i class="fas fa-envelope fa-5x text-success mb-4"></i>
                    <h3>تم إرسال الرابط!</h3>
                    <p class="text-muted">
                        يرجى التحقق من بريدك الإلكتروني والضغط على الرابط لإعادة تعيين كلمة المرور.
                    </p>
                    <p class="text-muted small">
                        لو ملقيتش الإيميل، اتأكد من الـ Spam Folder.
                    </p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">
                        <i class="fas fa-sign-in-alt"></i> العودة لتسجيل الدخول
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
